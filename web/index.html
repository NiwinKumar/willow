<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ECEBE7" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Doto:wght,ROND@600..900,0..100&family=Geist+Mono:wght@400;500&display=swap" />
    <meta name="description" content="Willow measures your skin from standardized photos and tells you whether a change is real or just the camera." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Willow" />
    <meta property="og:title" content="Willow: did your serum actually work?" />
    <meta property="og:description" content="Calibrated skin measurements from phone photos, a personal noise band, and Gemini that explains without inventing numbers." />
    <meta property="og:type" content="website" />
    <title>Willow</title>
    <style>html.proof-boot-dark,html.proof-boot-dark body{background:#0a0a0a;color-scheme:dark}</style>
    <script>
      // Willow Proof in its dark theme: paint the page dark before the app loads (no white flash on refresh).
      try {
        if (location.pathname.indexOf('/retail') === 0) {
          var t = localStorage.getItem('willow.proof.theme')
          if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('proof-boot-dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

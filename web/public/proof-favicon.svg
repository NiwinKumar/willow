<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Proof by Willow's tab icon: Willow's own frosted tulip bud (unchanged colours) on Proof's near-black
       Geist tile, so the retail product reads as Willow at a glance but never as the shopper app (round, light). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232326" />
      <stop offset="1" stop-color="#050505" />
    </linearGradient>
    <radialGradient id="bud" cx="50%" cy="72%" r="60%">
      <stop offset="0" stop-color="#FF6B4A" />
      <stop offset=".55" stop-color="#F25FA8" />
      <stop offset="1" stop-color="#C9A8FF" />
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6" /></filter>
    <filter id="softer" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="0.9" /></filter>
    <filter id="hair" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="0.4" /></filter>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#tile)" />
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#FFFFFF" stroke-opacity=".12" stroke-width="1.5" />
  <rect x="31" y="35" width="2.2" height="22" rx="1.1" fill="#6FAE9C" filter="url(#hair)" />
  <ellipse cx="39.5" cy="43.5" rx="8" ry="4.4" transform="rotate(-35 39.5 43.5)" fill="#86C5B0" filter="url(#softer)" />
  <path d="M32 9c7.6 0 13 5.6 13 14.2 0 8.3-5.8 14.3-13 14.3s-13-6-13-14.3C19 14.6 24.4 9 32 9z" fill="url(#bud)" filter="url(#soft)" />
</svg>

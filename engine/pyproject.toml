[project]
name = "willow-engine"
version = "0.0.1"
description = "Willow image pipeline (stateless CV service)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.142.1",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.13.5",
  "jsonschema==4.26.0",
  "numpy==2.4.6",
  "rawpy>=0.27.1",
  "pillow>=12.3.0",
  "pillow-heif==1.8.0",
  "colour-science==0.4.7",
  "scikit-image==0.26.0",
  "google-cloud-storage==3.15.1",
  "mediapipe==0.10.35",
  "opencv-contrib-python-headless==5.0.0.93",
  "scipy>=1.15",
]
# Claude Code adds and pins: numpy, rawpy, opencv-contrib-python-headless,
# scikit-image, colour-science, colour-checker-detection, mediapipe,
# pillow, pillow-heif, google-cloud-storage

[dependency-groups]
dev = ["pytest", "ruff", "httpx"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
# mediapipe depends on the desktop OpenCV build, which needs libGL (absent in the slim
# Cloud Run image). Drop it and install the headless build of the same version instead;
# both provide the same `cv2` module.
override-dependencies = ["opencv-contrib-python; sys_platform == 'never'"]

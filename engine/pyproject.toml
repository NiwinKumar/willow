[project]
name = "willow-engine"
version = "0.0.1"
description = "Willow image pipeline (stateless CV service)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "jsonschema",
  "numpy>=2.4.6",
  "rawpy>=0.27.1",
  "pillow>=12.3.0",
  "pillow-heif==1.8.0",
]
# Claude Code adds and pins: numpy, rawpy, opencv-contrib-python-headless,
# scikit-image, colour-science, colour-checker-detection, mediapipe,
# pillow, pillow-heif, google-cloud-storage

[dependency-groups]
dev = ["pytest", "ruff", "httpx"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
